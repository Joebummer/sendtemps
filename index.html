<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183d2a">
  <meta name="description" content="SendTemps has become Climbable. Discover climbing conditions across Australia in the Climbable iPhone app.">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>SendTemps is now Climbable</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #183d2a; color: #f7f4ee; display: grid; place-items: center; padding: 36px 22px; }
    main { width: min(100%, 540px); text-align: center; }
    .eyebrow { display: block; margin-bottom: 22px; color: #c7ddc5; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .mark { width: 74px; height: 74px; margin: 0 auto 28px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.26); border-radius: 22px; }
    .mark svg { width: 46px; height: 46px; }
    h1 { margin: 0 0 20px; font-size: clamp(38px, 8vw, 64px); font-weight: 750; letter-spacing: -.055em; line-height: 1.06; }
    p { max-width: 460px; margin: 0 auto 30px; color: #d5e2d5; font-size: 17px; line-height: 1.65; }
    .cta { display: inline-block; width: min(100%, 340px); padding: 17px 24px; border-radius: 11px; background: #f7f4ee; color: #183d2a; font-size: 16px; font-weight: 750; text-decoration: none; transition: background .15s; }
    .cta:hover, .cta:focus-visible { background: #dcebdc; }
    .note { display: block; margin-top: 23px; color: #b4c8b6; font-size: 13px; line-height: 1.5; }
    .note a { color: #f7f4ee; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 39 16 18l8 11L32 12l12 27H4Z"/><circle cx="32" cy="6" r="2" fill="currentColor" stroke="none"/></svg>
    </div>
    <span class="eyebrow">A new chapter for SendTemps</span>
    <h1>SendTemps is now Climbable.</h1>
    <p>We've retired the original SendTemps forecasts. For climbing conditions across Australia, better crag planning and weather alerts, find us on Climbable for iPhone.</p>
    <a class="cta" href="https://apps.apple.com/au/app/climbable/id6804840351">Get Climbable on the App Store ↗</a>
    <span class="note">Want to learn more? Visit <a href="https://climbable.app/">climbable.app</a>.</span>
  </main>
  <script>
    // Refresh the existing PWA service worker so returning users receive this page.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (registration) {
          registration.update().catch(function () {});
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
